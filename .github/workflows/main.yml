name: Build IPAs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set DEVELOPER_DIR and show versions
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          export DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          xcodebuild -version
          which clang
          which swiftc
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

      - name: Derive and sanitize HEADER_SEARCH_PATHS
        id: sanitize_paths
        run: |
          set -euo pipefail
          APP="${APP:-VoidLink}"

          RAW_LINE=$(xcodebuild -project "$APP.xcodeproj" -scheme "$APP" -showBuildSettings 2>/dev/null | sed -n 's/^[[:space:]]*HEADER_SEARCH_PATHS = //p' | head -n 1)

          if [ -z "$RAW_LINE" ]; then
            echo "Failed to extract HEADER_SEARCH_PATHS from build settings" >&2
            exit 1
          fi

          echo "Original HEADER_SEARCH_PATHS:"
          printf '%s\n' "$RAW_LINE"

          SANITIZED=$(printf '%s\n' "$RAW_LINE" | tr ' ' '\n' | \
            grep -v '^$' | \
            grep -v '/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/include' | \
            grep -v '/Users/runner/Library/Developer/Xcode/DerivedData' | \
            tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/[[:space:]]$//')

          if [ -z "$SANITIZED" ]; then
            echo "After filtering, SANITIZED became empty. Falling back to minimal relative set." >&2
            SANITIZED='$(inherited) $(SRCROOT)/moonlight-common/moonlight-common-c/src $(SRCROOT)/libs/**'
          else
            case "$SANITIZED" in
              *"\$(inherited)"*) : ;;
              *) SANITIZED="$(echo '$(inherited)') $SANITIZED" ;;
            esac
          fi

          echo "Sanitized HEADER_SEARCH_PATHS:"
          printf '%s\n' "$SANITIZED"

          {
            echo "SANITIZED_HEADER_SEARCH_PATHS<<EOF"
            echo "$SANITIZED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build FullScreen IPA
        run: |
          set -euo pipefail
          WORKING_LOCATION="$GITHUB_WORKSPACE"
          APP="VoidLink"
          VARIANT="FullScreen"
          BUILD_ROOT="$WORKING_LOCATION/build"

          cd "$WORKING_LOCATION"
          mkdir -p build && cd build

          plutil -replace UIRequiresFullScreen -bool true "../$APP/Limelight-Info.plist"

          xcodebuild \
            -project "$WORKING_LOCATION/$APP.xcodeproj" \
            -scheme "$APP" \
            -configuration Release \
            -derivedDataPath "$WORKING_LOCATION/build/DerivedDataApp" \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED="NO" \
            HEADER_SEARCH_PATHS="$SANITIZED_HEADER_SEARCH_PATHS"

          DD_APP="$WORKING_LOCATION/build/DerivedDataApp/Build/Products/Release-iphoneos/$APP.app"
          rm -rf "$BUILD_ROOT/Payload" "$BUILD_ROOT/$APP.app"
          cp -R "$DD_APP" "$BUILD_ROOT/$APP.app"
          (codesign --remove "$BUILD_ROOT/$APP.app" || true) 2>/dev/null
          rm -rf "$BUILD_ROOT/$APP.app/_CodeSignature" "$BUILD_ROOT/$APP.app/embedded.mobileprovision" || true

          mkdir -p "$BUILD_ROOT/Payload"
          cp -R "$BUILD_ROOT/$APP.app" "$BUILD_ROOT/Payload/$APP.app"

          EXEC=$(defaults read "$BUILD_ROOT/Payload/$APP.app/Info" CFBundleExecutable 2>/dev/null || echo "$APP")
          if [ -f "$BUILD_ROOT/Payload/$APP.app/$EXEC" ]; then
            strip "$BUILD_ROOT/Payload/$APP.app/$EXEC" || true
          fi

          (cd "$BUILD_ROOT" && zip -qry "${APP}_${VARIANT}.ipa" Payload)
          rm -rf "$BUILD_ROOT/Payload" "$BUILD_ROOT/$APP.app"

          echo "Produced IPA: $BUILD_ROOT/${APP}_${VARIANT}.ipa"

      - name: Upload FullScreen IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink_FullScreen.ipa
          path: build/VoidLink_FullScreen.ipa

      - name: Build StageManager IPA
        run: |
          set -euo pipefail
          WORKING_LOCATION="$GITHUB_WORKSPACE"
          APP="VoidLink"
          VARIANT="StageManager"
          BUILD_ROOT="$WORKING_LOCATION/build"

          cd "$WORKING_LOCATION"
          mkdir -p build && cd build

          plutil -replace UIRequiresFullScreen -bool false "../$APP/Limelight-Info.plist"

          xcodebuild \
            -project "$WORKING_LOCATION/$APP.xcodeproj" \
            -scheme "$APP" \
            -configuration Release \
            -derivedDataPath "$WORKING_LOCATION/build/DerivedDataApp" \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_ALLOWED="NO" \
            HEADER_SEARCH_PATHS="$SANITIZED_HEADER_SEARCH_PATHS"

          DD_APP="$WORKING_LOCATION/build/DerivedDataApp/Build/Products/Release-iphoneos/$APP.app"
          rm -rf "$BUILD_ROOT/Payload" "$BUILD_ROOT/$APP.app"
          cp -R "$DD_APP" "$BUILD_ROOT/$APP.app"
          (codesign --remove "$BUILD_ROOT/$APP.app" || true) 2>/dev/null
          rm -rf "$BUILD_ROOT/$APP.app/_CodeSignature" "$BUILD_ROOT/$APP.app/embedded.mobileprovision" || true

          mkdir -p "$BUILD_ROOT/Payload"
          cp -R "$BUILD_ROOT/$APP.app" "$BUILD_ROOT/Payload/$APP.app"

          EXEC=$(defaults read "$BUILD_ROOT/Payload/$APP.app/Info" CFBundleExecutable 2>/dev/null || echo "$APP")
          if [ -f "$BUILD_ROOT/Payload/$APP.app/$EXEC" ]; then
            strip "$BUILD_ROOT/Payload/$APP.app/$EXEC" || true
          fi

          (cd "$BUILD_ROOT" && zip -qry "${APP}_${VARIANT}.ipa" Payload)
          rm -rf "$BUILD_ROOT/Payload" "$BUILD_ROOT/$APP.app"

          echo "Produced IPA: $BUILD_ROOT/${APP}_${VARIANT}.ipa"

      - name: Upload StageManager IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink_StageManager.ipa
          path: build/VoidLink_StageManager.ipa
